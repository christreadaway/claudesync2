version: "3.8"

services:
  web:
    build: .
    ports:
      - "5111:5111"
    volumes:
      - ./data:/app/data
      - ${REPOS_PATH:-/home/user}:/repos:ro
    environment:
      - HOST=0.0.0.0
      - PORT=5111
      - SCAN_PATHS=/repos
      - SECRET_KEY=${SECRET_KEY:-}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD}
      - PRODUCTION=1
    restart: unless-stopped

  # Nginx reverse proxy with SSL (for claudesync.treadaway.org)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - web
    restart: unless-stopped
